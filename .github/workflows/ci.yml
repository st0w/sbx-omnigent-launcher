# What this can and cannot check, stated plainly.
#
# The unit suite (1,399 tests) does NOT run here. Six modules in this package
# import `omnigent`, the private host package this launcher plugs into, and it
# is not published. Without it only 22 tests collect and all 22 error, so a
# test job on a public runner would assert nothing. The suite runs where that
# package exists:
#
#     <omnigent-venv>/bin/python -m unittest discover -s tests
#
# Making it runnable here means declaring `click` and `pyyaml` as real
# dependencies and putting the `omnigent` imports behind an optional boundary.
# That is a code change, not a CI change; until then this workflow guards what
# it honestly can.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every action is pinned to a full commit SHA, not a tag: a tag can be
# moved to other code by whoever controls the action's repository. The
# comment names the release the SHA was taken from. Dependabot
# (.github/dependabot.yml) keeps both current.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # Pinned in pyproject under [tool.ruff]; line-length 79 and the rule
      # selection both come from there, so local and CI cannot disagree.
      # Every pre-commit hook on every file: ruff at the version the
      # config pins, and the file-length limit with its baseline.
      #
      # The baseline ratchet compares code-shape-baseline.toml with
      # HEAD^1: on a pull request, the merge commit's first parent, the
      # target branch; on a push to main, the commit before. Hence
      # fetch-depth 2 on the checkout above.
      - name: pre-commit
        env:
          SKIP: no-commit-to-branch
          CODE_SHAPE_BASE_REF: HEAD^1
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      # Catches a broken pyproject, a bad license expression, and package-data
      # that would ship a wheel without the role prompt templates.
      - name: Build wheel and sdist
        run: uv build
      - name: Confirm templates are in the wheel
        run: |
          python -c "
          import glob, zipfile, sys
          whl = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(whl).namelist()
          md = [n for n in names if n.endswith('.md') and 'templates/' in n]
          print(f'{len(md)} template(s) packaged')
          sys.exit(0 if md else 'templates missing from the wheel')
          "
      - name: Confirm subpackages are in the wheel
        run: |
          python -c "
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          need = 'sbx_omnigent/runner/__main__.py'
          sys.exit(0 if need in names else need + ' missing from the wheel')
          "
